[project]
name = "app-api"
version = "0.1.0"
description = "FastAPI on Cloud Run — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "firebase-admin==6.5.0",
    "uvicorn[standard]==0.30.0",
    "google-cloud-firestore==2.19.0",
    "google-cloud-storage==2.18.0",
    "google-cloud-pubsub==2.26.0",
    "google-cloud-secret-manager==2.20.0",
    "google-cloud-bigquery==3.25.0",
    "google-cloud-aiplatform==1.67.0",
    "pydantic==2.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.0",
]

# pytest 設定はプロジェクトルートの pytest.ini で集中管理
# （backend/tests と modules/*/backend/tests を横断的にロードするため）
